name: visionary-local
services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: visionary
      POSTGRES_PASSWORD: ${VISIONARY_LOCAL_DB_PASSWORD:?Set a local development database password}
      POSTGRES_DB: visionary_app
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - application_database:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionary -d visionary_app"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  application_database:
  cache_data:

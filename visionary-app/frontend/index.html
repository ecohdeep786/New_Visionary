<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Visionary — one intelligence that helps anyone learn, teach, support, build, and lead." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#121317" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <!-- Local self-hosted fonts — no external dependency -->
    <!-- D3 weight law: FIN-01 — only the Google Sans Flex variable set is
         preloaded (4 × ~128KB, used by every route). The Google Sans static
         faces are ~1.9MB each and are only referenced by workspace-surface
         routes (--font-product), so they load on demand there, never in the
         landing critical path. Preloading them unconditionally put ~5.7MB of
         dead wire behind every route on Fast 3G (observed in the 2026-10-25
         lab baseline). -->
    <!-- D3 weight law: FIN-01 — only the Google Sans Flex variable set is
         preloaded (4 × ~128KB, used by every route). The Google Sans static
         faces are ~1.9MB each and are only referenced by workspace-surface
         routes (--font-product), so they load on demand there, never in the
         landing critical path. Preloading them unconditionally put ~5.7MB of
         dead wire behind every route on Fast 3G (observed in the 2026-10-25
         lab baseline). No type attribute on font preloads: a font preload
         with a type attribute sends a different Accept than the @font-face
         fetch of the same URL, and the preload cache reuse then misses —
         observed 2026-10-27 as a full css-initiated re-fetch of all four
         faces at ~5.3s (double delivery) with the attribute present. -->
    <link rel="preload" as="font" href="/fonts/GoogleSansFlex-Regular.ttf" crossorigin>
    <link rel="preload" as="font" href="/fonts/GoogleSansFlex-Medium.ttf" crossorigin>
    <link rel="preload" as="font" href="/fonts/GoogleSansFlex-Bold.ttf" crossorigin>
    <link rel="preload" as="font" href="/fonts/GoogleSansFlex-Semibold.ttf" crossorigin>
    <title>Visionary — Learn, Ask, Build</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
